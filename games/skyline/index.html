<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravity Duel: Skyline</title>
<meta name="description" content="第三人稱 3D 機甲 1 對 1 對戰：城市、高速公路、樓頂。">
<link rel="icon" href="../../assets/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Noto+Sans+TC:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* One deliberate dark theme: a night city. Colours are tokens; the game paints everything else. */
  :root {
    --bg: #0a0d18; --fg: #e8ecf5; --muted: #8e97ad; --accent: #58e0ff; --gold: #d9b24c; --warn: #ff7a3d; --hot: #ff4b4b; --enemy: #ff6b6b;
    --panel: rgba(9, 12, 22, 0.84); --line: rgba(142, 151, 173, 0.25);
    --display: 'Russo One', 'Noto Sans TC', sans-serif; --body: 'Noto Sans TC', system-ui, sans-serif; --mono: 'Share Tech Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  body.playing #game { cursor: none; }

  #hud { position: fixed; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }
  #hud.hidden { display: none; }
  .gauge { display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 8px; font: 12px var(--mono); letter-spacing: 0.08em; color: var(--muted); }
  .gauge .bar { height: 8px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
  .gauge .bar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width 0.08s linear; }
  .gauge[data-state="low"] .bar i { background: var(--warn); }
  .gauge[data-state="hot"] .bar i { background: var(--hot); }
  .gauge.heat .bar i { background: var(--gold); }

  .top { position: absolute; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); width: min(360px, 46vw); }
  .me .name { font: 18px var(--display); letter-spacing: 0.08em; }
  .me .loadout { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .me .gauge.hp { grid-template-columns: 28px 1fr; }
  .me .gauge.hp .bar { height: 14px; }
  .me .gauge.hp .bar i { background: linear-gradient(90deg, #3ec9ff, var(--accent)); }
  .me .gauge.hp[data-state="low"] .bar i { background: var(--warn); }

  .gauges { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; width: min(300px, 46vw); }

  .weapons { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; --cd: 0; }
  .slot { display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 8px; min-width: 150px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: rgba(9, 12, 22, 0.6); color: var(--muted); font-size: 13px; position: relative; overflow: hidden; }
  .slot .key { font: 12px var(--mono); color: var(--muted); }
  .slot.active { border-color: var(--accent); color: var(--fg); box-shadow: 0 0 10px rgba(88, 224, 255, 0.25) inset; }
  .weapons.cooling .slot::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--cd) * 100%); background: rgba(255, 255, 255, 0.08); }

  .enemy, .reticle, .lost, .crosshair, .hitmark { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity 0.15s; will-change: transform; }
  .enemy.on, .reticle.on, .lost.on, .crosshair.on, .hitmark.on { opacity: 1; }
  .enemy { width: 150px; margin: -36px 0 0 -75px; text-align: center; }
  .enemy .name { font-size: 11px; color: var(--muted); white-space: nowrap; text-shadow: 0 1px 2px #000; }
  .enemy .gauge { grid-template-columns: 1fr; }
  .enemy .gauge .label { display: none; }
  .enemy .gauge .bar { height: 7px; border-color: rgba(255, 107, 107, 0.4); }
  .enemy .gauge .bar i { background: var(--enemy); }
  .enemy .gauge[data-state="low"] .bar i { background: var(--warn); }
  .reticle { width: 56px; height: 56px; margin: -28px 0 0 -28px; border: 2px solid rgba(88, 224, 255, 0.85); border-radius: 50%; box-shadow: 0 0 8px rgba(88, 224, 255, 0.5); display: grid; place-items: end center; }
  .reticle span { font: 10px var(--mono); letter-spacing: 0.2em; color: var(--accent); transform: translateY(16px); }
  .lost { width: 0; height: 0; border: 12px solid transparent; border-left: 22px solid var(--warn); margin: -12px 0 0 0; filter: drop-shadow(0 0 4px rgba(255, 122, 61, 0.7)); }
  .crosshair { left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; }
  .crosshair::before, .crosshair::after { content: ''; position: absolute; background: var(--accent); box-shadow: 0 0 6px var(--accent); transition: background 0.1s; }
  .crosshair::before { left: 14px; top: 0; width: 2px; height: 30px; }
  .crosshair::after { top: 14px; left: 0; width: 30px; height: 2px; }
  .crosshair:not(.ready)::before, .crosshair:not(.ready)::after { background: var(--muted); box-shadow: none; }
  .hitmark { left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; transform: rotate(45deg); border: 2px solid #fff; border-top: 0; border-left: 0; transition: none; }
  .vignette { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(255, 60, 40, 0.55)); transition: opacity 0.1s; }
  .msg { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font: 20px var(--display); letter-spacing: 0.2em; color: var(--gold); text-shadow: 0 0 12px rgba(217, 178, 76, 0.6); opacity: 0; transition: opacity 0.2s; }
  .msg.on { opacity: 1; }
  .ko { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; opacity: 0; transition: opacity 0.4s; }
  .ko.on { opacity: 1; }
  .ko .result { font: 72px var(--display); letter-spacing: 0.2em; color: var(--accent); text-shadow: 0 0 24px rgba(88, 224, 255, 0.6); }
  .ko.lose .result { color: var(--enemy); text-shadow: 0 0 24px rgba(255, 107, 107, 0.6); }
  .dmgnum { position: absolute; left: 0; top: 0; font: 22px var(--display); color: var(--gold); text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 4px rgba(217, 178, 76, 0.6); opacity: 0; transform: translate(-50%, 0); }
  .dmgnum.heavy { font-size: 32px; color: #fff; }
  .dmgnum.me { color: var(--enemy); }
  .dmgnum.on { animation: dmgpop 0.9s ease-out forwards; }
  @keyframes dmgpop { 0% { opacity: 1; transform: translate(-50%, 0) scale(1.5); } 20% { transform: translate(-50%, -14px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -52px) scale(0.9); } }
  .debug { position: absolute; left: 16px; top: calc(96px + env(safe-area-inset-top, 0px)); font: 12px var(--mono); color: var(--muted); white-space: pre; text-shadow: 0 1px 2px #000; }

  /* Menus: one panel in the middle of the screen, the live city behind it. */
  #screens { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; box-sizing: border-box; overflow: auto; background: radial-gradient(ellipse at center, rgba(10, 13, 24, 0.35), rgba(10, 13, 24, 0.85)); }
  #screens[hidden] { display: none; }
  #screens[data-screen="pause"], #screens[data-screen="ko"] { background: rgba(10, 13, 24, 0.55); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 26px; width: min(560px, 100%); box-sizing: border-box; backdrop-filter: blur(6px); }
  .panel.narrow { width: min(380px, 100%); text-align: center; }
  .panel h1 { font: 34px var(--display); margin: 0; letter-spacing: 0.06em; color: var(--fg); text-wrap: balance; }
  .panel h1 span { display: block; font-size: 18px; color: var(--accent); letter-spacing: 0.4em; margin-top: 2px; }
  .panel h2 { font: 18px var(--display); letter-spacing: 0.12em; margin: 16px 0 0; color: var(--fg); }
  .panel h2.big { font-size: 54px; letter-spacing: 0.2em; margin: 4px 0 0; }
  .panel h2.win { color: var(--accent); text-shadow: 0 0 24px rgba(88, 224, 255, 0.6); }
  .panel h2.lose { color: var(--enemy); text-shadow: 0 0 24px rgba(255, 107, 107, 0.6); }
  .panel .sub { color: var(--muted); margin: 8px 0 0; font-size: 13px; line-height: 1.5; }
  .menu { display: grid; gap: 8px; margin: 16px 0 0; }
  .mbtn { pointer-events: auto; cursor: pointer; font: 16px var(--body); color: var(--fg); background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); border-radius: 6px; padding: 10px 16px; text-align: left; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .panel.narrow .mbtn { justify-content: center; }
  .mbtn small { color: var(--muted); font-size: 12px; font-weight: 400; }
  .mbtn:hover { border-color: var(--muted); }
  .mbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .mbtn:disabled { opacity: 0.45; cursor: default; }
  .mbtn.primary { border-color: var(--accent); color: var(--accent); background: rgba(88, 224, 255, 0.08); }
  .mbtn.on { border-color: var(--gold); color: var(--gold); }
  .mbtn.small { display: inline-flex; font-size: 12px; padding: 3px 10px; margin-left: 6px; vertical-align: middle; }
  .row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .foot { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
  .note { color: var(--warn); font-size: 13px; margin: 12px 0 0; }
  .picker { display: grid; gap: 8px; margin: 14px 0 6px; }
  .picker .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .picker .rowlabel { color: var(--muted); font-size: 13px; width: 40px; }
  .picker .opt, .seg .opt { pointer-events: auto; cursor: pointer; font: 14px var(--body); color: var(--fg); background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; }
  .picker .opt:hover, .seg .opt:hover { border-color: var(--muted); }
  .picker .opt:focus-visible, .seg .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .picker .opt.on, .seg .opt.on { border-color: var(--accent); color: var(--accent); background: rgba(88, 224, 255, 0.08); }
  .picker .opt:disabled { opacity: 0.5; cursor: default; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .stagepick { margin-top: 14px; }
  .pickdesc { color: var(--muted); font-size: 12px; margin: 0 0 4px; min-height: 2.4em; }
  .cpu { color: var(--gold); font-size: 13px; margin: 0; }
  .settings { display: grid; grid-template-columns: auto 1fr 4em; align-items: center; gap: 12px; margin: 14px 0 0; font-size: 13px; color: var(--muted); }
  .settings input[type="range"] { min-width: 0; accent-color: var(--accent); }
  .settings input[type="checkbox"] { justify-self: start; width: 18px; height: 18px; accent-color: var(--accent); }
  .settings .val { font-family: var(--mono); color: var(--fg); text-align: right; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 14px 0 0; font-size: 13px; }
  .keys dt { color: var(--muted); }
  .keys dd { margin: 0; font-family: var(--mono); }
  .rules { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 14px 0 0; padding-left: 18px; }
  /* LAN: the room list, the manual address box, the two seats. */
  .panel.wide { width: min(720px, 100%); }
  .rooms { display: grid; gap: 8px; margin: 14px 0 0; }
  .room { pointer-events: auto; cursor: pointer; display: grid; gap: 2px; text-align: left; font: 15px var(--body); color: var(--fg); background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
  .room span { color: var(--muted); font-size: 12px; }
  .room:hover { border-color: var(--muted); }
  .room:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .room.primary { border-color: var(--accent); }
  .room.primary b { color: var(--accent); }
  .room.full, .room:disabled { opacity: 0.5; cursor: default; }
  .scan { color: var(--muted); font-size: 12px; margin: 8px 0 0; min-height: 1em; }
  .manual { margin: 12px 0 0; font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
  .manual span { display: flex; gap: 8px; align-items: center; }
  .manual input { pointer-events: auto; flex: 1; min-width: 0; font: 14px var(--mono); color: var(--fg); background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; }
  .manual input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .manual .mbtn.small { margin: 0; padding: 7px 14px; font-size: 14px; }
  .links { margin: 10px 0 0; padding-left: 18px; color: var(--fg); }
  .links code { font: 15px var(--mono); color: var(--accent); }
  .seats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0 0; }
  .seat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .seat.ready { border-color: var(--accent); box-shadow: 0 0 12px rgba(88, 224, 255, 0.15) inset; }
  .seat h3 { font: 14px var(--display); letter-spacing: 0.1em; margin: 0; color: var(--muted); }
  .seat .picker { margin-top: 10px; }
  .seat .peerload { margin: 12px 0 0; font-size: 15px; }
  .seat .state { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .seat.ready .state { color: var(--accent); }
  .seat .mbtn { width: 100%; justify-content: center; margin-top: 8px; }
  .sub.center { text-align: center; }
  @media (max-width: 600px) { .seats { grid-template-columns: 1fr; } }
  .net { position: absolute; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); font: 12px var(--mono); color: var(--muted); text-align: right; text-shadow: 0 1px 2px #000; }
  /* Touch controls: a floating stick on the left, camera drag on the right, buttons bottom right. */
  #touch { position: fixed; inset: 0; z-index: 5; touch-action: none; user-select: none; -webkit-user-select: none; }
  #touch[hidden] { display: none; }
  #touch .zone { position: absolute; top: 0; bottom: 0; width: 50%; }
  #touch .zone.left { left: 0; }
  #touch .zone.right { right: 0; }
  #touch .stick { position: absolute; left: 0; top: 0; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 2px solid rgba(88, 224, 255, 0.5); background: rgba(9, 12, 22, 0.35); pointer-events: none; display: none; }
  #touch .stick.on { display: block; }
  #touch .stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(88, 224, 255, 0.55); }
  #touch .tbtns { position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; justify-items: end; align-items: end; }
  #touch .tbtns button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(142, 151, 173, 0.5); background: rgba(9, 12, 22, 0.5); color: var(--fg); font: 14px var(--body); touch-action: none; padding: 0; }
  #touch .tbtns button.big { width: 72px; height: 72px; font-size: 15px; }
  #touch .tbtns button.small { width: 52px; height: 52px; font-size: 12px; }
  #touch .tbtns button.on { border-color: var(--accent); background: rgba(88, 224, 255, 0.3); }
  body.touch .weapons { bottom: calc(250px + env(safe-area-inset-bottom, 0px)); }
  body.touch .slot { min-width: 110px; }
  body.touch .gauges { width: 40vw; }
  @media (max-width: 480px) { .panel h1 { font-size: 26px; } .panel h2.big { font-size: 40px; } .top, .gauges { width: 46vw; } .slot { min-width: 110px; } }
  @media (prefers-reduced-motion: reduce) { .enemy, .reticle, .lost, .crosshair, .ko, .msg { transition: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "../../vendor/three/three.module.js", "three-addons": "../../vendor/three/addons.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="screens" hidden></div>
<div id="touch" hidden>
  <div class="zone left"></div>
  <div class="zone right"></div>
  <div class="stick"><i></i></div>
  <div class="tbtns">
    <button type="button" data-action="pause" class="small">選單</button>
    <button type="button" data-action="switchNext" class="small">切換</button>
    <button type="button" data-action="lock" class="small">鎖定</button>
    <button type="button" data-action="guard">防禦</button>
    <button type="button" data-action="dash">衝刺</button>
    <button type="button" data-action="aim">瞄準</button>
    <span></span>
    <button type="button" data-action="attack" class="big">攻擊</button>
    <button type="button" data-action="boost" class="big">噴射</button>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
